services:
  proxy:
    image: traefik:2.10
    command:
      # Traefik logs and providers
      - '--log.level=INFO'
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.file.filename=/etc/traefik/traefik-certs.yml'  # file provider for certs

      # Entrypoints
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      
      # Enable TLS on websecure
      - '--entrypoints.websecure.http.tls=true'
      
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080' # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro                    # your .cer and .key files
      - ./traefik-certs.yml:/etc/traefik/traefik-certs.yml:ro
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.traefik.rule=Host(`pms-dev-lasers4eu.stfc.ac.uk`)'
      - 'traefik.http.routers.traefik.entrypoints=websecure'
      - 'traefik.http.routers.traefik.service=api@internal'

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: duopassword
      POSTGRES_USER: duouser
      POSTGRES_DB: duo
    ports:
      - '5432:5432'
    volumes:
      - ./apps/backend/db_patches/:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql/data

  factory:
    image: 'ghcr.io/userofficeproject/user-office-factory:develop'
    init: true
    environment:
      - NODE_ENV=development
      - DATABASE_HOSTNAME=db
      - DATABASE_PORT=5432
      - DATABASE_USER=duouser
      - DATABASE_PASSWORD=duopassword
      - DATABASE_DATABASE=duo
    cap_add:
      - SYS_ADMIN
    depends_on:
      - db

  frontend:
    image: 'ghcr.io/userofficeproject/user-office-frontend:develop'
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.frontend.loadbalancer.server.port=8080'
      - 'traefik.http.routers.frontend.rule=(Host(`pms-dev-lasers4eu.stfc.ac.uk`) && PathPrefix(`/`))'
      - 'traefik.http.routers.frontend.entrypoints=websecure'
      - 'traefik.http.routers.frontend.tls=true'
    depends_on:
      - backend

  backend:
    image: 'ghcr.io/userofficeproject/user-office-backend:develop'
    environment:
      DATABASE_URL: postgres://duouser:duopassword@db:5432/duo
      JWT_SECRET: qMyLZALzs229ybdQXNyzYRdju7X784TH
      JWT_TOKEN_LIFE: 7d
      BASE_URL: https://pms-dev-lasers4eu.stfc.ac.uk
      NODE_ENV: development
      USER_OFFICE_FACTORY_ENDPOINT: http://factory:4500/generate
      AUTH_DISCOVERY_URL: https://pms-dev-lasers4eu.stfc.ac.uk:5001/.well-known/openid-configuration
      AUTH_CLIENT_ID: useroffice
      AUTH_CLIENT_SECRET: useroffice
      TZ: Europe/Stockholm
      DATE_FORMAT: dd-MM-yyyy
      DATE_TIME_FORMAT: dd-MM-yyyy HH:mm
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.backend.loadbalancer.server.port=4000'
      - 'traefik.http.routers.backend.rule=(Host(`pms-dev-lasers4eu.stfc.ac.uk`) && PathPrefix(`/api`, `/preview`, `/downloads`, `/files`, `/download`, `/uploads`, `/graphql`))'
      - 'traefik.http.routers.backend.entrypoints=websecure'
      - 'traefik.http.routers.backend.tls=true'
    depends_on:
      - duo-development-authorization-server
      - db
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  duo-development-authorization-server:
    build:
      context: ../user-office-development-authorization-server
    ports:
      - 5001:5001
    environment:
      ISSUER: https://pms-dev-lasers4eu.stfc.ac.uk
      DATABASE_URL: postgres://duouser:duopassword@db:5432/duo
      PORT: 5001
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.services.authserver.loadbalancer.server.port=5001'
      - 'traefik.http.routers.authserver.rule=(PathPrefix(`/interaction`) || PathPrefix(`/session`) || PathPrefix(`/auth`))'
      - 'traefik.http.routers.authserver.entrypoints=websecure'
      - 'traefik.http.routers.authserver.tls=true'
    depends_on:
      - db

volumes:
  postgres_data: